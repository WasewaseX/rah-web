name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./db/check.db"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Prisma generate + push (throwaway db)
        run: bun run db:push
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bunx tsc --noEmit
